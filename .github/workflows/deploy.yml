name: Deploy (prod)

# pull request → test (no deploy); push to main → test → deploy hosting, Firestore/Storage rules and functions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never cancel on main: that would kill a live deploy.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm ci --prefix functions   # root vitest also runs functions/ tests
      - run: npm run coverage            # every test project, inside the emulators
      - run: npm run build

  deploy:
    name: Deploy → Production
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions   # build type-checks functions/
      - run: npm run build          # reads committed .env.production (no build secrets needed)

      # firebase-tools pinned to 15.22.3: older builds ignore GOOGLE_APPLICATION_CREDENTIALS
      # and fail with "Failed to authenticate, have you run firebase login?".
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Hosting versions are content-addressed: redeploying identical content fails with
      # 400 "is the current active version". Swallow exactly that, fail on anything else.
      - name: Deploy hosting
        run: |
          set +e
          out=$(npx firebase-tools@15.22.3 deploy --only hosting --project team-lead-tracker --non-interactive 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            printf '%s\n' "$out" | grep -q "is the current active version" \
              && { echo "::notice::Hosting already up to date, nothing to release."; exit 0; }
            exit $code
          fi

      - name: Deploy Firestore and Storage rules
        run: npx firebase-tools@15.22.3 deploy --only firestore:rules,storage --project team-lead-tracker --non-interactive

      # Functions deploys cost Cloud Build + Artifact Registry; skip unless functions/
      # changed since the last successful deploy (compared to it, not the push's `before`,
      # so changes in [skip ci] commits still ship).
      - name: Check for functions changes
        id: functions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -w deploy.yml -b main -s success -L 1 --json headSha -q '.[0].headSha')
          if [ "${{ github.event_name }}" = push ] && [ -n "$last" ] \
            && git diff --quiet "$last" HEAD -- functions/ firebase.json; then
            echo "::notice::functions/ unchanged since $last, skipping functions deploy."
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy functions
        if: steps.functions.outputs.changed == 'true'
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: 60
        run: npx firebase-tools@15.22.3 deploy --only functions --project team-lead-tracker --non-interactive
