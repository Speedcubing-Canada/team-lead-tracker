name: Deploy (prod)

# pull request → test (no deploy); push to main → test → deploy hosting, rules and functions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never cancel on main: that would kill a live deploy.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm ci --prefix functions
      - run: npm --prefix functions run build

  deploy:
    name: Deploy → Production
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build          # reads committed .env.production (no build secrets needed)

      # firebase-tools pinned to 15.22.3: older builds ignore GOOGLE_APPLICATION_CREDENTIALS
      # and fail with "Failed to authenticate, have you run firebase login?".
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Hosting versions are content-addressed: redeploying identical content fails with
      # 400 "is the current active version". Swallow exactly that, fail on anything else.
      - name: Deploy hosting
        run: |
          set +e
          out=$(npx firebase-tools@15.22.3 deploy --only hosting --project team-lead-tracker --non-interactive 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            printf '%s\n' "$out" | grep -q "is the current active version" \
              && { echo "::notice::Hosting already up to date, nothing to release."; exit 0; }
            exit $code
          fi

      - name: Deploy Firestore rules
        run: npx firebase-tools@15.22.3 deploy --only firestore:rules --project team-lead-tracker --non-interactive

      - name: Deploy functions
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: 60
        run: |
          npm ci --prefix functions
          npx firebase-tools@15.22.3 deploy --only functions --project team-lead-tracker --non-interactive
